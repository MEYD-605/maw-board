[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.1"
authors = [
    "MEYD-605 <ai.no.1bro@gmail.com>",
    "Eric Zhang <ekzhang1@gmail.com>", # upstream sshx
]
license = "MIT"
description = "Oracle Board — collaborative terminal + workboard (MEYD; derived from sshx)."
repository = "https://github.com/MEYD-605/maw-board"
documentation = "https://github.com/MEYD-605/maw-board#readme"
keywords = ["oracle", "board", "terminal", "collaborative", "maw"]

[workspace.dependencies]
anyhow = "1.0.62"
clap = { version = "4.5.17", features = ["derive", "env"] }
prost = "0.13.4"
rand = "0.8.5"
serde = { version = "1.0.188", features = ["derive", "rc"] }
sshx-core = { version = "0.4.1", path = "crates/sshx-core" }
tokio = { version = "1.40.0", features = ["full"] }
tokio-stream = { version = "0.1.14", features = ["sync"] }
tonic = { version = "0.12.3", features = ["tls", "tls-webpki-roots"] }
tonic-build = "0.12.3"
tonic-reflection = "0.12.3"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

[profile.release]
strip = true
